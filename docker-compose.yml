services:

  # PostgreSQL
  postgres:
    image: postgres:latest
    container_name: my-postgres

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10


  # Apache Kafka
  kafka:
    image: apache/kafka:latest
    container_name: my-kafka

    ports:
      - "9092:9092"

    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Internal and external listeners
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      # Listener configuration
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single-node KRaft quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single broker development configuration
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Topic / message behaviour
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168

      # Allow the broker to delete old log segments when necessary
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

      # Internal Kafka topics for a single-broker development setup
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10


  # Kafka Topic
  kafka-topic:
    image: apache/kafka:latest
    container_name: my-kafka-topic

    command:
      [
      "/bin/bash",
      "-c",
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic classroom-air-quality --partitions 1 --replication-factor 1 && echo 'Kafka topic classroom-air-quality is ready.'"
      ]

    depends_on:
      kafka:
        condition: service_healthy


  # Kafka consumer
  consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: my-consumer

    command:
      ['python', '-m', 'app.consumer']

    depends_on:
      postgres:
        condition: service_healthy

      kafka-topic:
        condition: service_completed_successfully


  # Kafka producer
  producer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: my-producer

    command:
      ['python', '-m', 'app.producer']

    depends_on:
      kafka-topic:
        condition: service_completed_successfully


volumes:
  postgres_data:
  kafka_data: